name: Time-Release Vault

on:
  schedule:
    # Run at 12:00 PM UTC on the 1st and 15th of every month (approx every 2 weeks)
    - cron: '0 12 1,15 * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  release-project:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Release Next Project
      run: |
        # Define the order of release
        PROJECTS=("credit_risk_engine" "multi_armed_bandit" "dynamic_pricing" "prescriptive_collections" "causal_inference")
        
        for PROJECT in "${PROJECTS[@]}"; do
          VAULT_PATH=".vault/$PROJECT"
          PUBLIC_PATH="$PROJECT"
          
          # Check if project exists in vault but not in public
          if [ -d "$VAULT_PATH" ] && [ ! -d "$PUBLIC_PATH" ]; then
            echo "🚀 Releasing $PROJECT from the Vault..."
            
            # Execute the python script to run and generate any missing visual assets
            cd "$VAULT_PATH"
            python3 main.py
            cd ../..
            
            # Move visually ready project
            cp -r "$VAULT_PATH" "$PUBLIC_PATH"
            
            # Configure Git
            git config --global user.name "AI Decision Bot"
            git config --global user.email "bot@autohedge.ai"
            
            # Commit and Push
            git add "$PUBLIC_PATH"
            git commit -m "✨ New Decision Science Release: $PROJECT"
            git pull --rebase origin main
            git push
            
            echo "✅ Released $PROJECT"
            exit 0 # Exit after releasing ONE project
          fi
        done
        
        echo "No new projects to release (or all already released)."
